<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Rastreo en Tiempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050b18; color: white; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #map { height: 400px; border-radius: 24px; z-index: 10; cursor: crosshair; }
        .gradient-text { background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 242, 254, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); } }
        .btn-role { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-role:active { transform: scale(0.95); }
        .leaflet-container { background: #0b1426 !important; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen flex flex-col p-4 max-w-md mx-auto">
    
    <!-- PANTALLA DE SELECCIÓN DE ROL -->
    <div id="screen-setup" class="flex-1 flex flex-col justify-center items-center space-y-8 animate-fade-in">
        <header class="text-center">
            <h1 class="text-4xl font-extrabold gradient-text">FamiliaTrack</h1>
            <p class="text-slate-400 mt-2">Seguridad y conexión en cada viaje</p>
        </header>

        <div class="grid grid-cols-1 gap-4 w-full">
            <button onclick="selectRole('esposa')" class="btn-role glass p-6 rounded-3xl flex flex-col items-center border-2 border-transparent hover:border-cyan-500">
                <div class="bg-cyan-500/20 p-4 rounded-full mb-4">
                    <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </div>
                <span class="text-xl font-bold">Soy la Esposa</span>
                <span class="text-xs text-slate-500 text-center mt-1">Toca el mapa para definir tu ruta y compartir GPS</span>
            </button>

            <button onclick="selectRole('esposo')" class="btn-role glass p-6 rounded-3xl flex flex-col items-center border-2 border-transparent hover:border-orange-500">
                <div class="bg-orange-500/20 p-4 rounded-full mb-4">
                    <svg class="w-10 h-10 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </div>
                <span class="text-xl font-bold">Soy el Esposo</span>
                <span class="text-xs text-slate-500 text-center mt-1">Sigue la ruta y posición en tiempo real</span>
            </button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="screen-main" class="hidden flex-1 flex flex-col space-y-4">
        <div class="glass p-4 rounded-2xl flex justify-between items-center">
            <div>
                <h2 id="display-role" class="font-bold text-lg">Cargando...</h2>
                <p id="pairing-status" class="text-xs text-slate-400">Listo para emparejar</p>
            </div>
            <div id="pair-badge" class="bg-slate-800 px-3 py-1 rounded-full text-xs font-mono">CODE: 774210</div>
        </div>

        <!-- Instrucción dinámica -->
        <div id="map-instruction" class="bg-cyan-500/10 border border-cyan-500/30 p-2 rounded-lg text-[10px] text-center text-cyan-400 uppercase font-bold hidden">
            Toca el mapa para marcar el punto de PARTIDA
        </div>

        <div id="map" class="shadow-2xl border border-slate-800"></div>

        <!-- Panel Esposa -->
        <div id="controls-esposa" class="hidden space-y-3">
            <div class="glass p-4 rounded-2xl space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs uppercase text-cyan-400 tracking-wider">Planificador de Ruta</h3>
                    <button onclick="clearRoute()" class="text-[10px] bg-slate-800 px-2 py-1 rounded hover:bg-red-900/50">Limpiar Todo</button>
                </div>
                <div class="space-y-2 text-sm" id="route-summary">
                    <div class="flex items-center space-x-2"><span class="text-green-400">●</span> <span id="txt-start" class="text-slate-400 italic">Toca el mapa para origen</span></div>
                    <div id="waypoints-list" class="space-y-1"></div>
                    <div class="flex items-center space-x-2"><span class="text-red-400">■</span> <span id="txt-end" class="text-slate-400 italic">Toca el mapa para destino</span></div>
                </div>
                <button onclick="startTrip()" id="btn-start" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-sm shadow-lg shadow-cyan-900/20">INICIAR VIAJE Y COMPARTIR GPS</button>
            </div>
        </div>

        <!-- Panel Esposo -->
        <div id="controls-esposo" class="hidden space-y-3">
            <div class="glass p-4 rounded-2xl grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-900/50 p-2 rounded-lg">
                    <span class="block text-[10px] text-slate-500">VELOCIDAD</span>
                    <span id="stat-speed" class="font-bold text-cyan-400">0 km/h</span>
                </div>
                <div class="bg-slate-900/50 p-2 rounded-lg">
                    <span class="block text-[10px] text-slate-500">ACTUALIZADO</span>
                    <span id="stat-time" class="font-bold text-white">--:--</span>
                </div>
            </div>
            <div class="glass p-4 rounded-2xl">
                <h3 class="font-bold text-xs mb-3 text-orange-400 uppercase tracking-widest">Hoja de Ruta Activa</h3>
                <div id="esposo-route-display" class="space-y-2 text-sm">
                    <p class="text-slate-500 text-center py-2 italic">Sin ruta activa</p>
                </div>
            </div>
        </div>

        <button onclick="sendAlert()" class="w-full bg-red-600/10 border border-red-600/30 text-red-500 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest active:bg-red-600 active:text-white">🚨 Botón de Alerta / SOS</button>
    </div>
</div>

<script type="module">
    let STATE = {
        role: null,
        pairCode: '774210',
        tripStarted: false,
        currentPos: null,
        route: {
            start: null, // {lat, lng, name}
            end: null,
            waypoints: [] // Array de {lat, lng, name}
        }
    };

    let map, userMarker;
    let routeMarkers = [];
    let watchId = null;

    window.selectRole = (role) => {
        STATE.role = role;
        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('screen-main').classList.remove('hidden');
        document.getElementById('display-role').innerText = role === 'esposa' ? 'Modo: Esposa' : 'Modo: Esposo';
        
        if(role === 'esposa') {
            document.getElementById('controls-esposa').classList.remove('hidden');
            document.getElementById('map-instruction').classList.remove('hidden');
        } else {
            document.getElementById('controls-esposo').classList.remove('hidden');
        }

        initMap();
        syncLoop();
    };

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([4.6097, -74.0817], 6); // Default Colombia
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        userMarker = L.circleMarker([0, 0], {
            radius: 10,
            fillColor: '#06b6d4',
            color: '#fff',
            weight: 3,
            fillOpacity: 1
        }).addTo(map);

        // Click en mapa para la Esposa
        map.on('click', (e) => {
            if (STATE.role === 'esposa' && !STATE.tripStarted) {
                handleMapClick(e.latlng);
            }
        });

        // Intentar centrar en el usuario al inicio
        navigator.geolocation.getCurrentPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            map.setView(pos, 14);
            userMarker.setLatLng(pos);
        });
    }

    async function handleMapClick(latlng) {
        const name = `Punto (${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)})`;
        
        if (!STATE.route.start) {
            STATE.route.start = { ...latlng, name: "Punto de Partida" };
            addMarkerToMap(latlng, '#4ade80', 'Partida');
            document.getElementById('txt-start').innerText = "Fijado";
            document.getElementById('map-instruction').innerText = "Toca para paradas intermedias o DESTINO";
        } else if (!STATE.route.end) {
            // Si ya hay inicio, el siguiente puede ser waypoint o destino
            // Usaremos un prompt simple para decidir o simplemente el último es el destino
            if (STATE.route.waypoints.length < 5 && confirm("¿Es esta una parada intermedia? (Cancelar para marcar como DESTINO FINAL)")) {
                STATE.route.waypoints.push({ ...latlng, name: `Parada ${STATE.route.waypoints.length + 1}` });
                addMarkerToMap(latlng, '#fbbf24', 'Parada');
                renderWaypointsList();
            } else {
                STATE.route.end = { ...latlng, name: "Destino Final" };
                addMarkerToMap(latlng, '#f87171', 'Llegada');
                document.getElementById('txt-end').innerText = "Fijado";
                document.getElementById('map-instruction').innerText = "Ruta completa. Pulsa Iniciar.";
            }
        }
        broadcast();
    }

    function addMarkerToMap(latlng, color, label) {
        const m = L.circleMarker(latlng, {
            radius: 6,
            fillColor: color,
            color: '#fff',
            weight: 2,
            fillOpacity: 1
        }).addTo(map).bindTooltip(label, { permanent: true, direction: 'top' });
        routeMarkers.push(m);
    }

    function renderWaypointsList() {
        const container = document.getElementById('waypoints-list');
        container.innerHTML = STATE.route.waypoints.map((w, i) => `
            <div class="flex items-center space-x-2 ml-4 border-l border-slate-700 pl-2">
                <span class="text-yellow-500 text-[10px]">○</span>
                <span class="text-xs text-slate-300">Parada ${i+1} fijada</span>
            </div>
        `).join('');
    }

    window.clearRoute = () => {
        STATE.route = { start: null, end: null, waypoints: [] };
        routeMarkers.forEach(m => map.removeLayer(m));
        routeMarkers = [];
        document.getElementById('txt-start').innerText = "Toca el mapa para origen";
        document.getElementById('txt-end').innerText = "Toca el mapa para destino";
        document.getElementById('waypoints-list').innerHTML = "";
        document.getElementById('map-instruction').innerText = "Toca el mapa para marcar el punto de PARTIDA";
        broadcast();
    };

    window.startTrip = () => {
        if (!STATE.route.start || !STATE.route.end) {
            alert("Por favor marca inicio y fin en el mapa primero.");
            return;
        }

        STATE.tripStarted = true;
        document.getElementById('btn-start').innerText = "COMPARTIENDO EN VIVO...";
        document.getElementById('btn-start').className = "w-full bg-green-600 py-3 rounded-xl font-bold pulse";
        document.getElementById('map-instruction').classList.add('hidden');

        watchId = navigator.geolocation.watchPosition(p => {
            const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
            STATE.currentPos = { ...pos, speed: p.coords.speed || 0, time: new Date().toLocaleTimeString() };
            userMarker.setLatLng(pos);
            map.panTo(pos);
            broadcast();
        }, null, { enableHighAccuracy: true });
    };

    function broadcast() {
        localStorage.setItem(`ftrack_${STATE.pairCode}`, JSON.stringify(STATE));
    }

    function syncLoop() {
        setInterval(() => {
            const data = localStorage.getItem(`ftrack_${STATE.pairCode}`);
            if (!data) return;
            const cloud = JSON.parse(data);

            if (STATE.role === 'esposo') {
                // Actualizar marcadores de ruta si no existen
                if (cloud.route.start && routeMarkers.length === 0) {
                    syncRouteMarkers(cloud.route);
                }

                // Actualizar posición GPS
                if (cloud.currentPos) {
                    userMarker.setLatLng([cloud.currentPos.lat, cloud.currentPos.lng]);
                    document.getElementById('stat-speed').innerText = `${Math.round((cloud.currentPos.speed || 0) * 3.6)} km/h`;
                    document.getElementById('stat-time').innerText = cloud.currentPos.time;
                    map.setView([cloud.currentPos.lat, cloud.currentPos.lng], map.getZoom());
                }
                
                renderEsposoRouteList(cloud.route);
            }
        }, 2000);
    }

    function syncRouteMarkers(route) {
        if (route.start) addMarkerToMap(route.start, '#4ade80', 'Partida');
        route.waypoints.forEach(w => addMarkerToMap(w, '#fbbf24', 'Parada'));
        if (route.end) addMarkerToMap(route.end, '#f87171', 'Llegada');
    }

    function renderEsposoRouteList(route) {
        const container = document.getElementById('esposo-route-display');
        if (!route.start) return;
        
        let html = `<div class="flex items-center space-x-2"><span class="text-green-400">●</span> <span>Partida fijada</span></div>`;
        route.waypoints.forEach((w, i) => {
            html += `<div class="flex items-center space-x-2 ml-4 border-l border-slate-700 pl-2 text-slate-400"><span class="text-yellow-500 text-[10px]">○</span> <span>Parada ${i+1}</span></div>`;
        });
        html += `<div class="flex items-center space-x-2"><span class="text-red-400">■</span> <span>Destino: ${route.end ? 'Fijado' : 'Pendiente'}</span></div>`;
        
        container.innerHTML = html;
    }

    window.sendAlert = () => {
        alert("🚨 SEÑAL DE SOS ENVIADA. Tu ubicación actual ha sido marcada con prioridad.");
    };
</script>

</body>
</html>
