<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Vigilancia Efímera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; overflow: hidden; height: 100vh; }
        #map { position: absolute; inset: 0; z-index: 1; }
        .ui-panel { position: absolute; z-index: 1000; pointer-events: none; inset: 0; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .active-ui { pointer-events: auto; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .online { background: #10b981; box-shadow: 0 0 10px #10b981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .notif-toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Marker Styling */
        .user-marker { background: #000; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<!-- Login / Selección de Rol -->
<div id="auth-screen" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center p-6">
    <div class="max-w-sm w-full text-center">
        <div class="w-16 h-16 bg-black rounded-2xl mx-auto mb-6 flex items-center justify-center rotate-3">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        </div>
        <h1 class="text-3xl font-black mb-2">FAMILIATRACK</h1>
        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-10">Control de Vigilancia Efímero</p>
        
        <div class="grid grid-cols-1 gap-3">
            <button onclick="startSession('VIAJERO')" class="bg-black text-white py-5 rounded-2xl font-bold text-sm hover:scale-[1.02] transition-transform">INICIAR COMO VIAJERO</button>
            <button onclick="startSession('VIGILANTE')" class="bg-slate-100 text-black py-5 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-colors">ACCESO VIGILANTE</button>
        </div>
    </div>
</div>

<div id="app-ui" class="hidden h-screen w-screen relative">
    <div id="map"></div>
    
    <div class="ui-panel">
        <!-- Header -->
        <div class="flex justify-between items-start active-ui">
            <div class="glass p-4 flex items-center gap-4">
                <div id="role-icon" class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white font-bold">V</div>
                <div>
                    <h2 id="role-name" class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">SISTEMA ACTIVO</h2>
                    <div class="flex items-center gap-2">
                        <span class="status-dot online"></span>
                        <span class="text-sm font-bold">EN VIVO</span>
                    </div>
                </div>
            </div>
            <div id="notif-box" class="w-64 flex flex-col gap-2"></div>
        </div>

        <!-- Footer -->
        <div class="w-full max-w-md mx-auto active-ui">
            
            <!-- Panel Viajero -->
            <div id="panel-viajero" class="hidden glass p-6 space-y-4 mb-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-slate-400 uppercase">Configuración de Ruta</span>
                    <button onclick="resetData()" class="text-[10px] font-bold text-red-500">BORRAR TODO</button>
                </div>
                <div id="route-steps" class="max-h-32 overflow-y-auto space-y-2 py-2">
                    <p class="text-xs text-slate-400 italic text-center">Toca el mapa para marcar puntos de control</p>
                </div>
                <button id="btn-transmit" onclick="toggleTransmission()" class="w-full bg-black text-white py-4 rounded-xl font-bold text-sm">ACTIVAR GPS EN TIEMPO REAL</button>
            </div>

            <!-- Panel Vigilante -->
            <div id="panel-vigilante" class="hidden glass p-6 space-y-6 mb-4">
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Velocidad</p>
                        <p id="tel-speed" class="text-lg font-black">0 <small class="text-[10px]">km/h</small></p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Batería</p>
                        <p id="tel-bat" class="text-lg font-black">--%</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Progreso</p>
                        <p id="tel-prog" class="text-lg font-black">0%</p>
                    </div>
                </div>
                <div class="space-y-2">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase px-1">Estado de Checkpoints</h4>
                    <div id="v-checkpoints" class="space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
                <button onclick="destroySession()" class="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold text-xs border border-red-100">FINALIZAR Y DESTRUIR DATOS</button>
            </div>

        </div>
    </div>
</div>

<script>
    // El "JSON" de sesión en tiempo real vive en el Storage para simular una DB volátil
    const SESSION_KEY = "FT_VOLATILE_SESSION";
    
    let STATE = {
        role: null,
        active: false,
        data: {
            pos: { lat: 0, lng: 0, speed: 0, battery: 0 },
            route: [], // Array de {lat, lng, name, reached}
            logs: [],
            lastUpdate: null
        }
    };

    let map, userMarker, routeLine, markers = [];

    function startSession(role) {
        STATE.role = role;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-ui').classList.remove('hidden');
        document.getElementById('role-icon').innerText = role.charAt(0);
        document.getElementById('role-name').innerText = `MODO ${role}`;
        
        if(role === 'VIAJERO') document.getElementById('panel-viajero').classList.remove('hidden');
        else document.getElementById('panel-vigilante').classList.remove('hidden');

        initMap();
        setInterval(syncJSON, 1000); // Sincronización cada segundo
    }

    function initMap() {
        // Mapa Blanco Profesional
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0,0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        userMarker = L.circleMarker([0, 0], {
            radius: 8, fillColor: "#000", color: "#fff", weight: 3, fillOpacity: 1
        }).addTo(map);

        routeLine = L.polyline([], { color: '#000', weight: 2, dashArray: '5, 10', opacity: 0.4 }).addTo(map);

        if(STATE.role === 'VIAJERO') {
            map.on('click', e => {
                if(STATE.active) return;
                const point = { 
                    lat: e.latlng.lat, 
                    lng: e.latlng.lng, 
                    name: `Punto ${STATE.data.route.length + 1}`,
                    reached: false 
                };
                STATE.data.route.push(point);
                drawMarkers();
                updateViajeroList();
                saveJSON();
            });
            
            // GPS Inicial
            navigator.geolocation.getCurrentPosition(p => {
                const ll = [p.coords.latitude, p.coords.longitude];
                map.setView(ll, 16);
                userMarker.setLatLng(ll);
            });
        }
    }

    function drawMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        STATE.data.route.forEach(p => {
            const m = L.circleMarker([p.lat, p.lng], {
                radius: 6, fillColor: p.reached ? "#10b981" : "#94a3b8", color: "#fff", weight: 2, fillOpacity: 1
            }).addTo(map).bindTooltip(p.name);
            markers.push(m);
        });
        routeLine.setLatLngs(STATE.data.route.map(p => [p.lat, p.lng]));
    }

    function updateViajeroList() {
        const cont = document.getElementById('route-steps');
        cont.innerHTML = STATE.data.route.map(p => `
            <div class="flex items-center justify-between p-3 bg-white border border-slate-100 rounded-xl">
                <span class="text-xs font-bold">${p.name}</span>
                <span class="text-[10px] ${p.reached ? 'text-emerald-500' : 'text-slate-300'} font-black">${p.reached ? 'ALCANZADO' : 'PENDIENTE'}</span>
            </div>
        `).join('');
    }

    function toggleTransmission() {
        if(STATE.data.route.length < 2) return alert("Define una ruta mínima.");
        STATE.active = true;
        document.getElementById('btn-transmit').innerText = "TRANSMITIENDO EN VIVO...";
        document.getElementById('btn-transmit').classList.replace('bg-black', 'bg-emerald-500');
        
        // Activación de GPS Profesional (Google Maps Style)
        navigator.geolocation.watchPosition(pos => {
            STATE.data.pos = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                speed: Math.round((pos.coords.speed || 0) * 3.6),
                battery: Math.round(Math.random() * 20 + 70) // Simulación batería
            };
            STATE.data.lastUpdate = new Date().getTime();
            
            userMarker.setLatLng([STATE.data.pos.lat, STATE.data.pos.lng]);
            map.panTo([STATE.data.pos.lat, STATE.data.pos.lng]);

            checkArrivals(STATE.data.pos);
            saveJSON();
        }, null, { enableHighAccuracy: true });

        pushNotif("Transmisión Iniciada");
    }

    function checkArrivals(pos) {
        STATE.data.route.forEach(p => {
            if(!p.reached) {
                const dist = getDist(pos.lat, pos.lng, p.lat, p.lng);
                if(dist < 0.1) { // 100 metros
                    p.reached = true;
                    pushNotif(`Llegada a ${p.name}`);
                }
            }
        });
    }

    function getDist(l1,n1,l2,n2) {
        const R = 6371;
        const dLat = (l2-l1)*Math.PI/180;
        const dLon = (n2-n1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Lógica de JSON en tiempo real
    function saveJSON() {
        localStorage.setItem(SESSION_KEY, JSON.stringify(STATE.data));
    }

    function syncJSON() {
        const raw = localStorage.getItem(SESSION_KEY);
        if(!raw) return;
        const json = JSON.parse(raw);

        if(STATE.role === 'VIGILANTE') {
            // Sincronizar ruta y posición
            if(STATE.data.route.length !== json.route.length) {
                STATE.data.route = json.route;
                drawMarkers();
            }
            
            // Detectar notificaciones de llegada
            json.route.forEach((p, i) => {
                if(STATE.data.route[i] && !STATE.data.route[i].reached && p.reached) {
                    pushNotif(`VIAJERO LLEGÓ A ${p.name.toUpperCase()}`);
                    STATE.data.route[i].reached = true;
                    drawMarkers();
                }
            });

            // Actualizar Telemetría
            if(json.pos) {
                document.getElementById('tel-speed').innerHTML = `${json.pos.speed} <small class="text-[10px]">km/h</small>`;
                document.getElementById('tel-bat').innerText = `${json.pos.battery}%`;
                userMarker.setLatLng([json.pos.lat, json.pos.lng]);
                map.panTo([json.pos.lat, json.pos.lng]);
            }

            // Progreso
            const reachedCount = json.route.filter(p => p.reached).length;
            const perc = json.route.length ? Math.round((reachedCount / json.route.length) * 100) : 0;
            document.getElementById('tel-prog').innerText = `${perc}%`;

            document.getElementById('v-checkpoints').innerHTML = json.route.map(p => `
                <div class="flex items-center justify-between p-3 ${p.reached ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-200'} border rounded-xl">
                    <span class="text-xs font-bold ${p.reached ? 'text-emerald-700' : 'text-slate-500'}">${p.name}</span>
                    <span class="text-[9px] font-black">${p.reached ? 'COMPLETADO' : 'PENDIENTE'}</span>
                </div>
            `).join('');
        }
    }

    function pushNotif(msg) {
        const box = document.getElementById('notif-box');
        const n = document.createElement('div');
        n.className = "notif-toast glass p-3 border-l-4 border-black text-[11px] font-bold shadow-xl";
        n.innerHTML = `<p class="text-slate-400 text-[9px] mb-1">ALERTA SISTEMA</p>${msg}`;
        box.prepend(n);
        setTimeout(() => n.remove(), 4000);
    }

    function destroySession() {
        if(confirm("¿Seguro que deseas finalizar? Se borrarán todos los datos de ubicación de forma permanente.")) {
            localStorage.removeItem(SESSION_KEY);
            location.reload();
        }
    }

    function resetData() {
        localStorage.removeItem(SESSION_KEY);
        STATE.data.route = [];
        drawMarkers();
        updateViajeroList();
    }
</script>
</body>
</html>
