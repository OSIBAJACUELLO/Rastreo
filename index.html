<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Centro de Control y Vigilancia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --bg: #050505;
            --surface: #111111;
            --border: #222222;
            --accent-red: #ff3b5c;
            --accent-green: #00f281;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--primary);
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        #map { 
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .pointer-events-auto { pointer-events: auto; }
        .glass-panel {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .pin-input {
            letter-spacing: 0.8em;
            text-align: center;
            font-size: 1.8rem;
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 15px;
            border-radius: 16px;
            width: 180px;
        }
        .log-item {
            border-left: 2px solid #333;
            padding-left: 12px;
            margin-bottom: 8px;
            font-size: 10px;
        }
        .pulse-red {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 92, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 92, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 92, 0); }
        }
        .notification-toast {
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .leaflet-vignette {
            box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
            pointer-events: none;
            position: absolute;
            top:0; left:0; width:100%; height:100%; z-index: 1000;
        }
    </style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="screen-auth" class="fixed inset-0 z-[2000] bg-black flex flex-col items-center justify-center p-6 text-center">
    <div class="mb-10">
        <div class="w-16 h-16 bg-white rounded-2xl mx-auto mb-6 flex items-center justify-center rotate-3">
            <svg class="w-10 h-10 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tighter mb-2">FAMILIATRACK <span class="text-xs align-top font-normal text-gray-500">PRO</span></h1>
        <p class="text-gray-400 text-sm font-medium">SISTEMA DE VIGILANCIA ENCRIPTADO</p>
    </div>
    <div class="space-y-6">
        <input type="password" id="pin-field" maxlength="4" placeholder="••••" class="pin-input outline-none focus:border-white transition-all font-mono">
        <div class="flex flex-col gap-3 w-64">
            <button onclick="auth('VIAJERO')" class="bg-white text-black font-bold py-5 rounded-2xl hover:bg-gray-200 transition-all shadow-lg">ACCESO VIAJERO</button>
            <button onclick="auth('VIGILANTE')" class="bg-transparent border border-gray-700 text-white font-bold py-5 rounded-2xl hover:border-white transition-all">PANEL VIGILANTE</button>
        </div>
    </div>
</div>

<div id="main-ui" class="hidden h-screen w-screen relative">
    <div id="map"></div>
    <div class="leaflet-vignette"></div>

    <div class="ui-overlay">
        <!-- Barra Superior (Status) -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-panel p-4 flex items-center gap-5">
                <div id="status-icon" class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-lg transition-all">
                    <span id="role-initial" class="text-black font-bold text-xl">V</span>
                </div>
                <div>
                    <div id="role-display" class="font-bold text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-0.5">VIAJERO</div>
                    <div id="connection-status" class="text-sm font-bold flex items-center">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                        SISTEMA ACTIVO
                    </div>
                </div>
            </div>

            <div id="notif-area" class="flex flex-col gap-3 items-end w-64">
                <!-- Notificaciones flotantes -->
            </div>
        </div>

        <!-- Barra Inferior (Control) -->
        <div class="flex flex-col gap-5 pointer-events-auto max-w-lg mx-auto w-full">
            
            <!-- Panel Viajero -->
            <div id="panel-viajero" class="hidden glass-panel p-6 space-y-5 border-t-2 border-white/10">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-black tracking-widest text-gray-400">PLAN DE VIGILANCIA</h3>
                    <div class="flex gap-2">
                        <button onclick="resetRoute()" class="text-[9px] text-gray-500 hover:text-white uppercase tracking-tighter">Limpiar</button>
                    </div>
                </div>
                
                <div id="route-list" class="space-y-3 max-h-48 overflow-y-auto custom-scrollbar">
                    <p id="empty-msg" class="text-center text-xs text-gray-600 py-4 italic">Toca el mapa para establecer la ruta de seguridad...</p>
                </div>

                <div class="flex gap-3">
                    <button id="btn-start" onclick="initTracking()" class="flex-1 bg-white text-black font-black py-4 rounded-xl text-sm hover:scale-[1.02] transition-all disabled:opacity-50">
                        INICIAR MISIÓN
                    </button>
                    <button onclick="exportData()" class="bg-gray-900 p-4 rounded-xl border border-gray-800 hover:border-gray-600 transition-all">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                </div>
            </div>

            <!-- Panel Vigilante (Centro de Control) -->
            <div id="panel-vigilante" class="hidden glass-panel p-6 space-y-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <span class="text-[9px] text-gray-500 block uppercase mb-1">Velocidad</span>
                        <span id="v-speed" class="text-xl font-black">0 <small class="text-[10px] font-medium text-gray-400">km/h</small></span>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <span class="text-[9px] text-gray-500 block uppercase mb-1">Altitud</span>
                        <span id="v-alt" class="text-xl font-black">0 <small class="text-[10px] font-medium text-gray-400">m</small></span>
                    </div>
                    <div id="v-signal" class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <span class="text-[9px] text-gray-500 block uppercase mb-1">Señal GPS</span>
                        <span class="text-xl font-black text-green-500">EXC</span>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Estado de Puntos de Control</h3>
                        <span id="v-progress" class="text-[10px] bg-white text-black px-2 py-0.5 rounded-full font-bold">0%</span>
                    </div>
                    <div id="v-route-progress" class="space-y-2">
                        <!-- Progreso dinámico sincronizado -->
                    </div>
                </div>

                <div class="bg-black/40 rounded-xl p-4 border border-white/5 h-24 overflow-y-auto" id="event-logs">
                    <p class="text-[9px] text-gray-600 font-mono">Esperando transmisión de datos...</p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const CONFIG = {
        pin: "1234",
        geofenceRadius: 0.15, // 150 metros
        syncKey: "ftrack_secure_link_77"
    };

    let STATE = {
        role: null,
        points: [], // {lat, lng, type, name, status: 'pending'|'reached', timeReached: null}
        current: { lat: 0, lng: 0, speed: 0, alt: 0, time: '--:--' },
        logs: [],
        active: false
    };

    let map, userMarker, routeLine;
    let mapMarkers = [];

    function auth(role) {
        const pin = document.getElementById('pin-field').value;
        if (pin === CONFIG.pin) {
            STATE.role = role;
            document.getElementById('screen-auth').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            document.getElementById('role-display').innerText = role;
            document.getElementById('role-initial').innerText = role.charAt(0);
            
            if(role === 'VIAJERO') {
                document.getElementById('panel-viajero').style.display = 'block';
            } else {
                document.getElementById('panel-vigilante').style.display = 'block';
                document.getElementById('status-icon').classList.add('bg-orange-500');
            }
            initMap();
        } else {
            alert("ACCESO DENEGADO");
            document.getElementById('pin-field').value = "";
        }
    }

    function initMap() {
        map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            fadeAnimation: true 
        }).setView([0,0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        userMarker = L.circleMarker([0, 0], {
            radius: 10, fillColor: 'white', color: '#000', weight: 4, fillOpacity: 1
        }).addTo(map);

        routeLine = L.polyline([], { 
            color: 'white', weight: 2, dashArray: '8, 12', opacity: 0.5 
        }).addTo(map);

        if (STATE.role === 'VIAJERO') {
            map.on('click', handleMapClick);
        }

        navigator.geolocation.getCurrentPosition(p => {
            const ll = [p.coords.latitude, p.coords.longitude];
            map.setView(ll, 16);
            userMarker.setLatLng(ll);
        });

        // Loop de sincronización profesional
        setInterval(syncSession, 1500);
    }

    function handleMapClick(e) {
        if (STATE.active) return;
        
        let type = 'checkpoint';
        let color = '#555';
        let name = `Punto ${STATE.points.length + 1}`;

        if (STATE.points.length === 0) {
            type = 'origin';
            color = '#fff';
            name = 'Punto de Partida';
        } else if (confirm("¿Marcar como DESTINO FINAL?")) {
            type = 'destination';
            color = '#ff3b5c';
            name = 'Objetivo Final';
        }

        const point = {
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            type: type,
            name: name,
            status: 'pending',
            timeReached: null
        };

        STATE.points.push(point);
        renderMarker(point, color);
        updateViajeroUI();
        save();
    }

    function renderMarker(p, color) {
        const m = L.circleMarker([p.lat, p.lng], {
            radius: 7, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.9
        }).addTo(map).bindTooltip(p.name, { 
            permanent: false, 
            className: 'bg-black text-white border-0 text-[10px] font-bold p-1 rounded' 
        });
        mapMarkers.push(m);
        
        routeLine.setLatLngs(STATE.points.map(pt => [pt.lat, pt.lng]));
    }

    function updateViajeroUI() {
        const list = document.getElementById('route-list');
        document.getElementById('empty-msg').style.display = 'none';
        
        list.innerHTML = STATE.points.map((p, i) => `
            <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 rounded-full ${p.status === 'reached' ? 'bg-green-500' : 'bg-gray-700'}"></div>
                    <span class="text-xs font-bold uppercase tracking-tighter">${p.name}</span>
                </div>
                <span class="text-[9px] text-gray-500">${p.status === 'reached' ? 'LLEGADA: ' + p.timeReached : 'POR LLEGAR'}</span>
            </div>
        `).join('');
    }

    function initTracking() {
        if (STATE.points.length < 2) return alert("Ruta incompleta.");
        STATE.active = true;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-start').innerText = "TRANSMITIENDO...";
        addLog("MISIÓN INICIADA - TRANSMISIÓN GPS ACTIVA");

        navigator.geolocation.watchPosition(pos => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            STATE.current = { 
                lat: latlng.lat, 
                lng: latlng.lng, 
                speed: pos.coords.speed || 0,
                alt: pos.coords.altitude || 0,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            userMarker.setLatLng([latlng.lat, latlng.lng]);
            map.panTo([latlng.lat, latlng.lng]);
            
            checkGeofence(latlng);
            save();
        }, null, { enableHighAccuracy: true });
    }

    function checkGeofence(curr) {
        STATE.points.forEach(p => {
            if (p.status === 'pending') {
                const dist = getDistance(curr.lat, curr.lng, p.lat, p.lng);
                if (dist <= CONFIG.geofenceRadius) {
                    p.status = 'reached';
                    p.timeReached = new Date().toLocaleTimeString();
                    addLog(`ZONA ALCANZADA: ${p.name.toUpperCase()}`);
                    pushNotification(`VIAJERO EN ${p.name.toUpperCase()}`);
                    updateViajeroUI();
                }
            }
        });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2-lat1) * Math.PI/180;
        const dLon = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function save() {
        localStorage.setItem(CONFIG.syncKey, JSON.stringify(STATE));
    }

    function syncSession() {
        const dataRaw = localStorage.getItem(CONFIG.syncKey);
        if (!dataRaw) return;
        const remote = JSON.parse(dataRaw);

        if (STATE.role === 'VIGILANTE') {
            // Sincronizar Ruta en Mapa
            if (STATE.points.length !== remote.points.length) {
                STATE.points = remote.points;
                mapMarkers.forEach(m => map.removeLayer(m));
                mapMarkers = [];
                STATE.points.forEach(p => {
                    const c = p.type === 'origin' ? '#fff' : (p.type === 'destination' ? '#ff3b5c' : '#888');
                    renderMarker(p, c);
                });
            }

            // Detectar cambios de estado para notificar al vigilante localmente
            remote.points.forEach((rp, i) => {
                if (STATE.points[i] && STATE.points[i].status !== rp.status && rp.status === 'reached') {
                    pushNotification(`¡ALERTA! VIAJERO LLEGÓ A ${rp.name.toUpperCase()}`);
                    STATE.points[i].status = 'reached';
                }
            });

            // Telemetría
            if (remote.current) {
                document.getElementById('v-speed').innerHTML = `${Math.round(remote.current.speed * 3.6)} <small class="text-[10px] text-gray-500">km/h</small>`;
                document.getElementById('v-alt').innerHTML = `${Math.round(remote.current.alt)} <small class="text-[10px] text-gray-500">m</small>`;
                document.getElementById('time-val')?.innerText || (document.getElementById('time-val') && (document.getElementById('time-val').innerText = remote.current.time));
                userMarker.setLatLng([remote.current.lat, remote.current.lng]);
                
                if (remote.active) {
                    map.panTo([remote.current.lat, remote.current.lng]);
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 bg-red-500 rounded-full mr-2 pulse-red"></span> RASTREO EN VIVO';
                }
            }

            // Logs
            if (remote.logs.length > STATE.logs.length) {
                STATE.logs = remote.logs;
                const logCont = document.getElementById('event-logs');
                logCont.innerHTML = STATE.logs.map(l => `
                    <div class="log-item">
                        <span class="text-gray-500 mr-2">[${l.time}]</span>
                        <span class="font-bold text-white uppercase">${l.msg}</span>
                    </div>
                `).reverse().join('');
            }

            // Progreso
            const reachedCount = remote.points.filter(p => p.status === 'reached').length;
            const perc = remote.points.length > 0 ? Math.round((reachedCount / remote.points.length) * 100) : 0;
            document.getElementById('v-progress').innerText = `${perc}%`;
            
            document.getElementById('v-route-progress').innerHTML = remote.points.map(p => `
                <div class="flex items-center justify-between text-[11px] p-2 bg-white/5 rounded-lg">
                    <span class="${p.status === 'reached' ? 'text-green-400 font-bold' : 'text-gray-600'}">${p.name}</span>
                    <span class="text-[9px] opacity-60">${p.status === 'reached' ? '✓' : '...' }</span>
                </div>
            `).join('');
        }
    }

    function pushNotification(msg) {
        const area = document.getElementById('notif-area');
        const n = document.createElement('div');
        n.className = "notification-toast glass-panel p-4 border-l-4 border-white flex items-start gap-3 pointer-events-auto w-full";
        n.innerHTML = `
            <div class="bg-white rounded p-1"><svg class="w-3 h-3 text-black" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/></svg></div>
            <div>
                <p class="text-[10px] font-black text-white leading-tight uppercase">${msg}</p>
                <p class="text-[8px] text-gray-500 mt-1">${new Date().toLocaleTimeString()}</p>
            </div>
        `;
        area.prepend(n);
        setTimeout(() => n.remove(), 6000);
    }

    function addLog(msg) {
        STATE.logs.push({ msg, time: new Date().toLocaleTimeString() });
        save();
    }

    function resetRoute() {
        if (STATE.active) return;
        STATE.points = [];
        STATE.logs = [];
        mapMarkers.forEach(m => map.removeLayer(m));
        mapMarkers = [];
        routeLine.setLatLngs([]);
        updateViajeroUI();
        save();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(STATE, null, 4));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `mision_track_${Date.now()}.json`);
        dlAnchorElem.click();
    }
</script>

</body>
</html>
