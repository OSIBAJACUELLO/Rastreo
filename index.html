<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Vigilancia Efímera Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; overflow: hidden; height: 100vh; }
        #map { position: absolute; inset: 0; z-index: 1; }
        .ui-panel { position: absolute; z-index: 1000; pointer-events: none; inset: 0; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .active-ui { pointer-events: auto; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; }
        .online { background: #10b981; box-shadow: 0 0 12px #10b981; animation: pulse 1.5s infinite; }
        .offline { background: #f59e0b; box-shadow: 0 0 12px #f59e0b; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        .notif-toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .user-marker { background: #000; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 15px rgba(0,0,0,0.3); }
        input:focus { outline: none; border-color: black; }
    </style>
</head>
<body>

<!-- Pantalla de Inicio -->
<div id="auth-screen" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-sm w-full">
        <div class="w-16 h-16 bg-black rounded-2xl mx-auto mb-6 flex items-center justify-center rotate-3 shadow-2xl">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        </div>
        <h1 class="text-3xl font-black mb-2 tracking-tighter">FAMILIATRACK</h1>
        <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-10">Sincronización por Nombre de Viaje</p>
        
        <div class="grid grid-cols-1 gap-4">
            <div class="space-y-2">
                <input id="trip-name-input" type="text" placeholder="NOMBRE DEL VIAJE (Ej: RUTA1)" class="w-full p-4 rounded-2xl border-2 border-slate-100 font-bold text-center uppercase tracking-widest text-sm focus:border-black transition-all">
                <p class="text-[9px] text-slate-400 font-bold">Viajero: Define un nombre / Vigilante: Busca el nombre</p>
            </div>
            
            <button onclick="startSession('VIAJERO')" class="group relative bg-black text-white py-5 rounded-3xl font-bold text-sm overflow-hidden transition-all hover:scale-[1.02] active:scale-95">
                <span class="relative z-10">MODO VIAJERO (GPS)</span>
            </button>
            <button onclick="startSession('VIGILANTE')" class="bg-slate-100 text-black py-5 rounded-3xl font-bold text-sm hover:bg-slate-200 transition-all active:scale-95">
                BUSCAR Y VIGILAR
            </button>
        </div>
    </div>
</div>

<div id="app-ui" class="hidden h-screen w-screen relative">
    <div id="map"></div>
    
    <div class="ui-panel">
        <!-- Cabecera Status -->
        <div class="flex justify-between items-start active-ui">
            <div class="glass p-4 flex items-center gap-4">
                <div id="role-icon" class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white font-black text-lg">V</div>
                <div>
                    <h2 id="display-trip-name" class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">VIAJE: ---</h2>
                    <div class="flex items-center gap-2">
                        <span id="conn-dot" class="status-dot offline"></span>
                        <span id="conn-text" class="text-xs font-black uppercase tracking-tight text-slate-600">Desconectado</span>
                    </div>
                </div>
            </div>
            <div id="notif-box" class="w-64 flex flex-col gap-2"></div>
        </div>

        <!-- Controles Inferiores -->
        <div class="w-full max-w-md mx-auto active-ui px-2">
            <!-- Panel Viajero -->
            <div id="panel-viajero" class="hidden glass p-6 space-y-4 mb-4">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Plan de Ruta</span>
                    <button onclick="resetData()" class="text-[10px] font-bold text-red-500 uppercase hover:underline">Limpiar</button>
                </div>
                <div id="route-steps" class="max-h-32 overflow-y-auto space-y-2 py-1 scroll-smooth">
                    <p class="text-xs text-slate-400 italic text-center py-4">Toca el mapa para definir los puntos de control</p>
                </div>
                <button id="btn-transmit" onclick="toggleTransmission()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-sm tracking-widest shadow-xl shadow-black/20 transition-all hover:bg-slate-900 active:scale-95">
                    INICIAR TRANSMISIÓN
                </button>
            </div>

            <!-- Panel Vigilante -->
            <div id="panel-vigilante" class="hidden glass p-6 space-y-6 mb-4">
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100 shadow-sm">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Velocidad</p>
                        <p id="tel-speed" class="text-base font-black italic">0 <span class="text-[8px] not-italic text-slate-400">km/h</span></p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100 shadow-sm">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Batería</p>
                        <p id="tel-bat" class="text-base font-black">--%</p>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100 shadow-sm">
                        <p class="text-[8px] font-black text-slate-400 uppercase">Ruta</p>
                        <p id="tel-prog" class="text-base font-black">0%</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <div id="v-checkpoints" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
                </div>
                <button onclick="destroySession()" class="w-full bg-red-50 text-red-600 py-3 rounded-xl font-black text-[10px] border border-red-100 uppercase tracking-[0.15em] hover:bg-red-100 transition-colors">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Prefijo para soportar múltiples viajes en LocalStorage simultáneamente
    const PREFIX = "FT_TRIP_";
    
    let STATE = {
        role: null,
        active: false,
        tripName: "",
        data: {
            pos: { lat: 0, lng: 0, speed: 0, battery: 100 },
            route: [],
            lastUpdate: 0,
            isTransmitting: false
        }
    };

    let map, userMarker, routeLine, markers = [];

    function startSession(role) {
        const name = document.getElementById('trip-name-input').value.trim().toUpperCase();
        if(!name) {
            alert("Por favor, ingresa el nombre del viaje.");
            return;
        }
        
        STATE.tripName = name;
        STATE.role = role;
        
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-ui').classList.remove('hidden');
        document.getElementById('role-icon').innerText = role.charAt(0);
        document.getElementById('display-trip-name').innerText = `VIAJE: ${name}`;
        
        if(role === 'VIAJERO') {
            document.getElementById('panel-viajero').classList.remove('hidden');
            document.getElementById('conn-text').innerText = "Preparando ruta...";
        } else {
            document.getElementById('panel-vigilante').classList.remove('hidden');
            document.getElementById('conn-text').innerText = `Buscando: ${name}`;
        }

        initMap();
        setInterval(syncCore, 1000); 
    }

    function initMap() {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.6, -74.0], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        userMarker = L.circleMarker([0, 0], {
            radius: 10, fillColor: "#000", color: "#fff", weight: 3, fillOpacity: 1
        }).addTo(map);

        routeLine = L.polyline([], { color: '#000', weight: 2, dashArray: '8, 12', opacity: 0.3 }).addTo(map);

        if(STATE.role === 'VIAJERO' && navigator.geolocation) {
            map.on('click', e => {
                if(STATE.active) return;
                const point = { 
                    lat: e.latlng.lat, 
                    lng: e.latlng.lng, 
                    name: `Punto ${STATE.data.route.length + 1}`,
                    reached: false 
                };
                STATE.data.route.push(point);
                refreshVisuals();
                updateViajeroUI();
                saveToCloud();
            });
            
            navigator.geolocation.getCurrentPosition(p => {
                const ll = [p.coords.latitude, p.coords.longitude];
                map.setView(ll, 16);
                userMarker.setLatLng(ll);
            }, null, { enableHighAccuracy: true });
        }
    }

    function refreshVisuals() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        STATE.data.route.forEach(p => {
            const m = L.circleMarker([p.lat, p.lng], {
                radius: 7, fillColor: p.reached ? "#10b981" : "#fff", color: "#000", weight: 2, fillOpacity: 1
            }).addTo(map).bindTooltip(p.name, { direction: 'top', offset: [0, -10], className: 'font-bold text-[9px] uppercase shadow-none border-none' });
            markers.push(m);
        });
        routeLine.setLatLngs(STATE.data.route.map(p => [p.lat, p.lng]));
    }

    function updateViajeroUI() {
        const cont = document.getElementById('route-steps');
        if(STATE.data.route.length === 0) {
            cont.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">Toca el mapa para definir puntos de control</p>`;
            return;
        }
        cont.innerHTML = STATE.data.route.map(p => `
            <div class="flex items-center justify-between p-3 bg-white border border-slate-100 rounded-2xl shadow-sm">
                <span class="text-xs font-black text-slate-700">${p.name}</span>
                <span class="text-[9px] ${p.reached ? 'text-emerald-500' : 'text-slate-300'} font-black uppercase tracking-tighter">${p.reached ? 'Llegaste' : 'Pendiente'}</span>
            </div>
        `).join('');
    }

    function toggleTransmission() {
        if(STATE.data.route.length < 1) return alert("Marca al menos un destino en el mapa.");
        STATE.active = true;
        STATE.data.isTransmitting = true;
        
        const btn = document.getElementById('btn-transmit');
        btn.innerText = "TRASMITIENDO VIAJE...";
        btn.classList.replace('bg-black', 'bg-emerald-500');
        
        navigator.geolocation.watchPosition(pos => {
            STATE.data.pos = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                speed: Math.round((pos.coords.speed || 0) * 3.6),
                battery: 88 
            };
            STATE.data.lastUpdate = Date.now(); 
            
            userMarker.setLatLng([STATE.data.pos.lat, STATE.data.pos.lng]);
            map.panTo([STATE.data.pos.lat, STATE.data.pos.lng]);

            checkCheckpoints(STATE.data.pos);
            saveToCloud();
        }, null, { enableHighAccuracy: true });

        pushNotif(`Viaje "${STATE.tripName}" iniciado`);
    }

    function checkCheckpoints(pos) {
        STATE.data.route.forEach(p => {
            if(!p.reached) {
                const dist = getDistance(pos.lat, pos.lng, p.lat, p.lng);
                if(dist < 0.15) { 
                    p.reached = true;
                    pushNotif(`¡Check-in: ${p.name}!`);
                    refreshVisuals();
                    updateViajeroUI();
                }
            }
        });
    }

    function getDistance(l1, n1, l2, n2) {
        const R = 6371;
        const dLat = (l2-l1)*Math.PI/180;
        const dLon = (n2-n1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function saveToCloud() {
        localStorage.setItem(PREFIX + STATE.tripName, JSON.stringify(STATE.data));
    }

    function syncCore() {
        const raw = localStorage.getItem(PREFIX + STATE.tripName);
        
        if(STATE.role === 'VIAJERO') {
            if(STATE.active) {
                STATE.data.lastUpdate = Date.now();
                saveToCloud();
                document.getElementById('conn-dot').className = "status-dot online";
                document.getElementById('conn-text').innerText = "Transmitiendo";
            }
            return;
        }

        // --- Lógica del Vigilante ---
        if(!raw) {
            document.getElementById('conn-text').innerText = "Esperando que inicie...";
            return;
        }
        
        const cloudData = JSON.parse(raw);
        const now = Date.now();
        const diff = now - cloudData.lastUpdate;

        if(diff < 6000 && cloudData.isTransmitting) {
            document.getElementById('conn-dot').className = "status-dot online";
            document.getElementById('conn-text').innerText = "VIGILANDO";
        } else {
            document.getElementById('conn-dot').className = "status-dot offline";
            document.getElementById('conn-text').innerText = "FUERA DE LÍNEA";
        }

        if(JSON.stringify(STATE.data.route) !== JSON.stringify(cloudData.route)) {
            STATE.data.route = cloudData.route;
            refreshVisuals();
            renderVigilanteCheckpoints();
        }

        if(cloudData.pos) {
            document.getElementById('tel-speed').innerHTML = `${cloudData.pos.speed} <span class="text-[8px] not-italic text-slate-400">km/h</span>`;
            document.getElementById('tel-bat').innerText = `${cloudData.pos.battery}%`;
            userMarker.setLatLng([cloudData.pos.lat, cloudData.pos.lng]);
            if(diff < 5000) map.panTo([cloudData.pos.lat, cloudData.pos.lng]);
        }

        const total = cloudData.route.length;
        const reached = cloudData.route.filter(p => p.reached).length;
        document.getElementById('tel-prog').innerText = total > 0 ? `${Math.round((reached/total)*100)}%` : '0%';
    }

    function renderVigilanteCheckpoints() {
        const cont = document.getElementById('v-checkpoints');
        cont.innerHTML = STATE.data.route.map(p => `
            <div class="flex items-center justify-between p-3 ${p.reached ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100'} border rounded-2xl shadow-sm transition-all">
                <span class="text-xs font-bold ${p.reached ? 'text-emerald-700' : 'text-slate-600'}">${p.name}</span>
                <div class="flex items-center gap-2">
                    ${p.reached ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-tighter">Completado</span>' : '<span class="text-[8px] font-black text-slate-300 uppercase tracking-tighter">Pendiente</span>'}
                </div>
            </div>
        `).join('');
    }

    function pushNotif(msg) {
        const box = document.getElementById('notif-box');
        const n = document.createElement('div');
        n.className = "notif-toast glass p-4 border-l-4 border-black text-[10px] font-bold shadow-xl pointer-events-auto flex flex-col";
        n.innerHTML = `<span class="text-slate-400 text-[8px] mb-1 uppercase tracking-widest">Estado del Viaje</span>${msg}`;
        box.prepend(n);
        setTimeout(() => n.remove(), 5000);
    }

    function destroySession() {
        if(confirm("¿Deseas cerrar la vigilancia?")) {
            location.reload();
        }
    }

    function resetData() {
        localStorage.removeItem(PREFIX + STATE.tripName);
        STATE.data.route = [];
        refreshVisuals();
        updateViajeroUI();
    }
</script>
</body>
</html>
