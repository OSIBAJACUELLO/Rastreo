<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Sistema de Rastreo Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --border: #333333;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--primary);
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        #map { 
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            box-sizing: border-box;
        }
        .pointer-events-auto { pointer-events: auto; }
        .glass-dark {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
        }
        .pin-input {
            letter-spacing: 1em;
            text-align: center;
            font-size: 1.5rem;
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 150px;
        }
        .notif-badge {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        /* Estilo personalizado para Leaflet */
        .leaflet-vignette {
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            pointer-events: none;
            position: absolute;
            top:0; left:0; width:100%; height:100%; z-index: 1000;
        }
    </style>
</head>
<body>

<!-- Pantalla de Login con PIN -->
<div id="screen-auth" class="fixed inset-0 z-[2000] bg-black flex flex-col items-center justify-center p-6 text-center">
    <div class="mb-8">
        <h1 class="text-3xl font-bold tracking-tighter mb-2">FAMILIATRACK</h1>
        <p class="text-gray-500 text-sm">Ingresa el PIN de acceso familiar</p>
    </div>
    <div class="space-y-4">
        <input type="password" id="pin-field" maxlength="4" placeholder="••••" class="pin-input outline-none focus:border-white transition-all">
        <div class="grid grid-cols-2 gap-3 mt-4">
            <button onclick="auth('viajero')" class="bg-white text-black font-bold py-4 px-6 rounded-2xl hover:bg-gray-200 transition-all">VIAJERO</button>
            <button onclick="auth('vigilante')" class="border border-white text-white font-bold py-4 px-6 rounded-2xl hover:bg-white hover:text-black transition-all">VIGILANTE</button>
        </div>
    </div>
</div>

<div id="main-ui" class="hidden h-screen w-screen relative">
    <div id="map"></div>
    <div class="leaflet-vignette"></div>

    <div class="ui-overlay">
        <!-- Top Bar -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-dark p-4 flex items-center gap-4">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                    <span id="role-icon" class="text-black font-bold text-lg">V</span>
                </div>
                <div>
                    <div id="role-label" class="font-bold text-xs uppercase tracking-widest text-gray-400">VIAJERO</div>
                    <div id="user-status" class="text-sm font-semibold text-white">Sincronizando GPS...</div>
                </div>
            </div>

            <div class="flex flex-col gap-2 items-end">
                <div id="notif-container" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex flex-col gap-4 pointer-events-auto max-w-md mx-auto w-full">
            
            <!-- Panel de Ruta (Viajero) -->
            <div id="panel-viajero" class="hidden glass-dark p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h3 class="text-sm font-bold tracking-widest">PLANIFICADOR</h3>
                    <button onclick="exportData()" class="text-[10px] text-gray-400 border border-gray-700 px-2 py-1 rounded hover:bg-white hover:text-black">DESCARGAR JSON</button>
                </div>
                
                <div id="route-steps" class="space-y-2 overflow-y-auto max-h-40 pr-2">
                    <!-- Dinámico -->
                </div>

                <div id="instr-viajero" class="text-xs text-gray-500 italic bg-white/5 p-2 rounded text-center">
                    Toca el mapa para marcar: Origen → Paradas → Destino
                </div>

                <button id="btn-action" onclick="startTracking()" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all">
                    CONFIRMAR RUTA Y ENVIAR
                </button>
            </div>

            <!-- Panel de Estado (Vigilante) -->
            <div id="panel-vigilante" class="hidden glass-dark p-5 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <span class="text-[10px] text-gray-500 block uppercase">Velocidad</span>
                        <span id="speed-val" class="text-2xl font-bold">0 <small class="text-xs font-normal">km/h</small></span>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <span class="text-[10px] text-gray-500 block uppercase">Última Actividad</span>
                        <span id="time-val" class="text-2xl font-bold">--:--</span>
                    </div>
                </div>
                <div id="progress-container" class="space-y-2">
                    <!-- Progreso de la ruta del viajero -->
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const APP_PIN = "1234"; // PIN de ejemplo
    let STATE = {
        role: null,
        points: [], // {lat, lng, type, name, completed: false}
        currentPos: null,
        isTracking: false,
        log: []
    };

    let map, userMarker, polyline;
    let markers = [];

    function auth(role) {
        const input = document.getElementById('pin-field').value;
        if (input === APP_PIN) {
            STATE.role = role;
            document.getElementById('screen-auth').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            document.getElementById('role-label').innerText = role;
            document.getElementById('role-icon').innerText = role.charAt(0).toUpperCase();
            
            if(role === 'viajero') {
                document.getElementById('panel-viajero').style.display = 'block';
            } else {
                document.getElementById('panel-vigilante').style.display = 'block';
            }
            initApp();
        } else {
            alert("PIN Incorrecto");
            document.getElementById('pin-field').value = "";
        }
    }

    function initApp() {
        // Mapa oscuro minimalista
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.6, -74], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        userMarker = L.circleMarker([0, 0], {
            radius: 8, fillColor: 'white', color: '#000', weight: 2, fillOpacity: 1
        }).addTo(map);

        polyline = L.polyline([], { color: 'rgba(255,255,255,0.3)', weight: 3, dashArray: '10, 10' }).addTo(map);

        if (STATE.role === 'viajero') {
            map.on('click', onMapClick);
        }

        // Recuperar posición inicial
        navigator.geolocation.getCurrentPosition(p => {
            const latlng = [p.coords.latitude, p.coords.longitude];
            map.setView(latlng, 15);
            userMarker.setLatLng(latlng);
        });

        // Bucle de sincronización
        setInterval(sync, 2000);
    }

    function onMapClick(e) {
        if (STATE.isTracking) return;
        
        let type = 'parada';
        let color = '#888';
        let label = 'Parada';

        if (STATE.points.length === 0) {
            type = 'inicio';
            color = '#fff';
            label = 'Inicio';
        } else if (confirm("¿Este es el destino final?")) {
            type = 'llegada';
            color = '#ff3b5c';
            label = 'Destino';
        }

        const point = {
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            type: type,
            name: `${label} #${STATE.points.length + 1}`,
            completed: false
        };

        STATE.points.push(point);
        addPointMarker(point, color);
        updateRouteUI();
    }

    function addPointMarker(p, color) {
        const m = L.circleMarker([p.lat, p.lng], {
            radius: 6, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.8
        }).addTo(map).bindTooltip(p.name, { direction: 'top', className: 'bg-black text-white border-0 text-[10px]' });
        markers.push(m);
        
        const path = STATE.points.map(pt => [pt.lat, pt.lng]);
        polyline.setLatLngs(path);
    }

    function updateRouteUI() {
        const container = document.getElementById('route-steps');
        container.innerHTML = STATE.points.map((p, i) => `
            <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <span class="status-dot" style="background: ${p.completed ? '#4ade80' : '#444'}"></span>
                    <span class="text-xs font-semibold">${p.name}</span>
                </div>
                <span class="text-[9px] text-gray-500">${p.completed ? 'COMPLETADO' : 'PENDIENTE'}</span>
            </div>
        `).join('');
    }

    function startTracking() {
        if (STATE.points.length < 2) return alert("Define al menos origen y destino");
        STATE.isTracking = true;
        document.getElementById('btn-action').innerText = "RUTEO EN VIVO...";
        document.getElementById('btn-action').className = "w-full bg-blue-600 text-white font-bold py-4 rounded-2xl animate-pulse";
        document.getElementById('instr-viajero').innerText = "Compartiendo ubicación en tiempo real.";

        navigator.geolocation.watchPosition(pos => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            STATE.currentPos = { 
                ...latlng, 
                speed: pos.coords.speed || 0,
                time: new Date().toLocaleTimeString()
            };
            userMarker.setLatLng([latlng.lat, latlng.lng]);
            map.panTo([latlng.lat, latlng.lng]);
            
            checkProximity(latlng);
            saveToCloud();
        }, null, { enableHighAccuracy: true });
    }

    function checkProximity(curr) {
        STATE.points.forEach((p, index) => {
            if (!p.completed) {
                const dist = getDistance(curr.lat, curr.lng, p.lat, p.lng);
                if (dist < 0.1) { // 100 metros
                    p.completed = true;
                    notify(`Viajero llegó a: ${p.name}`);
                    logEvent(`Llegada a ${p.name}`);
                    updateRouteUI();
                }
            }
        });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function saveToCloud() {
        localStorage.setItem(`track_data_${APP_PIN}`, JSON.stringify(STATE));
    }

    function sync() {
        const raw = localStorage.getItem(`track_data_${APP_PIN}`);
        if (!raw) return;
        const data = JSON.parse(raw);

        if (STATE.role === 'vigilante') {
            // Sincronizar puntos en el mapa del vigilante
            if (STATE.points.length !== data.points.length) {
                STATE.points = data.points;
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                STATE.points.forEach(p => {
                    const color = p.type === 'inicio' ? '#fff' : (p.type === 'llegada' ? '#ff3b5c' : '#888');
                    addPointMarker(p, color);
                });
            }

            // Sincronizar posición actual
            if (data.currentPos) {
                userMarker.setLatLng([data.currentPos.lat, data.currentPos.lng]);
                document.getElementById('speed-val').innerHTML = `${Math.round((data.currentPos.speed || 0) * 3.6)} <small class="text-xs font-normal">km/h</small>`;
                document.getElementById('time-val').innerText = data.currentPos.time;
                document.getElementById('user-status').innerText = "Rastreando Viajero...";
                
                // Si la posición cambió, centrar mapa opcionalmente
                if (!STATE.currentPos || STATE.currentPos.lat !== data.currentPos.lat) {
                    map.panTo([data.currentPos.lat, data.currentPos.lng]);
                    STATE.currentPos = data.currentPos;
                }
            }

            // Renderizar progreso para vigilante
            const progContainer = document.getElementById('progress-container');
            progContainer.innerHTML = data.points.map(p => `
                <div class="flex items-center gap-3 bg-white/5 p-2 rounded-lg border border-white/5">
                    <div class="w-2 h-2 rounded-full ${p.completed ? 'bg-green-500 shadow-[0_0_8px_#4ade80]' : 'bg-gray-700'}"></div>
                    <span class="text-[11px] font-bold ${p.completed ? 'text-white' : 'text-gray-500'}">${p.name}</span>
                </div>
            `).join('');
        }
    }

    function notify(msg) {
        const container = document.getElementById('notif-container');
        const n = document.createElement('div');
        n.className = "notif-badge glass-dark p-3 text-xs font-bold border-l-4 border-white flex items-center gap-2 pointer-events-auto";
        n.innerHTML = `<span class="animate-ping w-2 h-2 rounded-full bg-white"></span> ${msg}`;
        container.prepend(n);
        setTimeout(() => n.remove(), 5000);
    }

    function logEvent(msg) {
        STATE.log.push({ event: msg, time: new Date().toISOString() });
        saveToCloud();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `familia_track_${new Date().getTime()}.json`;
        a.click();
    }
</script>

</body>
</html>
