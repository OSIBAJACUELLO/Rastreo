<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliaTrack - Sistema de Vigilancia Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --bg-light: #f8f9fa;
            --border: #e2e8f0;
            --accent: #2563eb;
        }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-light); 
            color: var(--primary);
            margin: 0; overflow: hidden; height: 100vh;
        }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        /* UI Overlay */
        .ui-container {
            position: absolute; z-index: 1000; pointer-events: none;
            width: 100%; height: 100%; padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .pointer-events-auto { pointer-events: auto; }

        /* Glass Cards White */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Marker Pulses */
        .pulse-marker {
            width: 20px; height: 20px;
            background: rgba(37, 99, 235, 0.2);
            border: 2px solid #2563eb;
            border-radius: 50%;
            position: relative;
        }
        .pulse-marker::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: #2563eb; border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .notif-item {
            animation: slideUp 0.4s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<!-- Login -->
<div id="screen-auth" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center p-8 text-center">
    <div class="max-w-md w-full">
        <div class="w-20 h-20 bg-black rounded-3xl mx-auto mb-8 flex items-center justify-center shadow-2xl rotate-6">
            <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight mb-4">FAMILIATRACK</h1>
        <p class="text-slate-500 font-medium mb-10 uppercase tracking-widest text-xs">Vigilancia Profesional en Tiempo Real</p>
        
        <div class="space-y-4">
            <input type="password" id="pin-field" maxlength="4" placeholder="INTRODUCE PIN" class="w-full text-center text-3xl font-bold tracking-[0.5em] py-5 bg-slate-50 border-2 border-slate-200 rounded-3xl focus:border-black outline-none transition-all">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="auth('VIAJERO')" class="bg-black text-white font-bold py-5 rounded-3xl hover:bg-zinc-800 transition-all text-sm">ROL VIAJERO</button>
                <button onclick="auth('VIGILANTE')" class="bg-white border-2 border-slate-200 text-black font-bold py-5 rounded-3xl hover:bg-slate-50 transition-all text-sm">ROL VIGILANTE</button>
            </div>
        </div>
    </div>
</div>

<div id="main-ui" class="hidden h-screen w-screen relative">
    <div id="map"></div>

    <div class="ui-container">
        <!-- TOP: Status Bar -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-card p-4 flex items-center gap-4">
                <div id="role-tag" class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center text-white font-black text-xl">V</div>
                <div>
                    <div id="role-label" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ESTADO DEL SISTEMA</div>
                    <div id="connection-status" class="text-sm font-bold flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                        TRANSMITIENDO GPS
                    </div>
                </div>
            </div>

            <div id="notif-feed" class="flex flex-col gap-2 w-64"></div>
        </div>

        <!-- BOTTOM: Control Panel -->
        <div class="w-full max-w-xl mx-auto pointer-events-auto">
            
            <!-- Panel Viajero -->
            <div id="panel-viajero" class="hidden glass-card p-6 mb-4 space-y-5">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm tracking-tight">CONFIGURAR RUTA DE SEGUIMIENTO</h3>
                    <button onclick="clearRoute()" class="text-[10px] text-red-500 font-bold uppercase">Limpiar</button>
                </div>
                
                <div id="waypoint-list" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar">
                    <div class="text-center py-4 text-slate-400 text-sm italic">Marca puntos en el mapa para iniciar...</div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-start" onclick="toggleTracking()" class="flex-1 bg-black text-white font-black py-4 rounded-2xl text-sm shadow-xl shadow-black/10">
                        ACTIVAR TRANSMISIÓN EN VIVO
                    </button>
                </div>
            </div>

            <!-- Panel Vigilante -->
            <div id="panel-vigilante" class="hidden glass-card p-6 mb-4 space-y-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center p-3 rounded-2xl bg-slate-50 border border-slate-100">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase">Km/h</span>
                        <span id="tel-speed" class="text-xl font-extrabold">0</span>
                    </div>
                    <div class="text-center p-3 rounded-2xl bg-slate-50 border border-slate-100">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase">Ruta</span>
                        <span id="tel-progress" class="text-xl font-extrabold">0%</span>
                    </div>
                    <div class="text-center p-3 rounded-2xl bg-slate-50 border border-slate-100">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase">Batería</span>
                        <span class="text-xl font-extrabold">88%</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center px-1">
                        <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Control de Checkpoints</h4>
                        <span id="last-sync" class="text-[10px] text-slate-300">Sinc: --:--</span>
                    </div>
                    <div id="v-route-status" class="space-y-2 overflow-y-auto max-h-40 custom-scrollbar pr-2"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const CONFIG = {
        pin: "1234",
        syncKey: "ft_monitor_v2_data",
        radius: 0.12 // 120 metros para detectar llegada
    };

    let STATE = {
        role: null,
        waypoints: [], // {lat, lng, type, name, reached: false, reachedTime: null}
        pos: { lat: 0, lng: 0, speed: 0, time: '--:--' },
        active: false,
        logs: []
    };

    let map, userMarker, routePath;
    let markers = [];

    function auth(role) {
        if (document.getElementById('pin-field').value === CONFIG.pin) {
            STATE.role = role;
            document.getElementById('screen-auth').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('role-label').innerText = `MODO ${role}`;
            document.getElementById(`panel-${role.toLowerCase()}`).classList.remove('hidden');
            document.getElementById('role-tag').innerText = role.charAt(0);
            
            initSystem();
        } else {
            alert("PIN Incorrecto");
            document.getElementById('pin-field').value = "";
        }
    }

    function initSystem() {
        // Mapa Blanco Profesional con relieve suave
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.6, -74], 6);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        userMarker = L.marker([0, 0], {
            icon: L.divIcon({ className: 'pulse-marker', iconSize: [20, 20] })
        }).addTo(map);

        routePath = L.polyline([], { color: '#000', weight: 2, dashArray: '10, 10', opacity: 0.3 }).addTo(map);

        if (STATE.role === 'VIAJERO') {
            map.on('click', onMapClick);
            requestGPS();
        } else {
            document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></span> ESCUCHANDO SEÑAL';
        }

        // Bucle de sincronización de alta frecuencia
        setInterval(sync, 1000);
    }

    function requestGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(p => {
            const ll = [p.coords.latitude, p.coords.longitude];
            map.setView(ll, 15);
            userMarker.setLatLng(ll);
        });
    }

    function onMapClick(e) {
        if (STATE.active) return;

        let type = 'checkpoint';
        let name = `Parada ${STATE.waypoints.length + 1}`;
        let color = '#94a3b8';

        if (STATE.waypoints.length === 0) {
            type = 'start';
            name = 'Inicio de Ruta';
            color = '#000';
        } else if (confirm("¿Este es el destino final?")) {
            type = 'end';
            name = 'Destino Final';
            color = '#2563eb';
        }

        const point = { lat: e.latlng.lat, lng: e.latlng.lng, type, name, reached: false };
        STATE.waypoints.push(point);
        
        addMarker(point, color);
        updateViajeroUI();
        save();
    }

    function addMarker(p, color) {
        const m = L.circleMarker([p.lat, p.lng], {
            radius: 8, fillColor: color, color: '#fff', weight: 3, fillOpacity: 1
        }).addTo(map).bindTooltip(p.name, { direction: 'top', className: 'font-bold text-[10px] rounded-lg' });
        
        markers.push(m);
        routePath.setLatLngs(STATE.waypoints.map(w => [w.lat, w.lng]));
    }

    function updateViajeroUI() {
        const container = document.getElementById('waypoint-list');
        container.innerHTML = STATE.waypoints.map(w => `
            <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full ${w.reached ? 'bg-emerald-500 shadow-lg' : 'bg-slate-300'}"></div>
                    <span class="text-xs font-bold uppercase tracking-tighter">${w.name}</span>
                </div>
                <span class="text-[9px] font-black text-slate-400">${w.reached ? 'PASADO' : 'PENDIENTE'}</span>
            </div>
        `).join('');
    }

    function toggleTracking() {
        if (STATE.waypoints.length < 2) return alert("Define origen y destino.");
        STATE.active = true;
        document.getElementById('btn-start').className = "flex-1 bg-emerald-500 text-white font-black py-4 rounded-2xl text-sm animate-pulse";
        document.getElementById('btn-start').innerText = "TRANSMITIENDO POSICIÓN...";
        
        notify("Seguimiento activado. Vigilante notificado.");

        navigator.geolocation.watchPosition(pos => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            STATE.pos = {
                ...latlng,
                speed: Math.round((pos.coords.speed || 0) * 3.6),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            userMarker.setLatLng([latlng.lat, latlng.lng]);
            map.panTo([latlng.lat, latlng.lng]);
            
            checkArrival(latlng);
            save();
        }, null, { enableHighAccuracy: true });
    }

    function checkArrival(curr) {
        STATE.waypoints.forEach(w => {
            if (!w.reached) {
                const dist = calculateDistance(curr.lat, curr.lng, w.lat, w.lng);
                if (dist < CONFIG.radius) {
                    w.reached = true;
                    w.reachedTime = new Date().toLocaleTimeString();
                    notify(`Viajero llegó a: ${w.name}`);
                    updateViajeroUI();
                }
            }
        });
    }

    function calculateDistance(l1, n1, l2, n2) {
        const R = 6371;
        const dLat = (l2-l1) * Math.PI/180;
        const dLon = (n2-n1) * Math.PI/180;
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function save() {
        localStorage.setItem(CONFIG.syncKey, JSON.stringify(STATE));
    }

    function sync() {
        const raw = localStorage.getItem(CONFIG.syncKey);
        if (!raw) return;
        const remote = JSON.parse(raw);

        if (STATE.role === 'VIGILANTE') {
            // Sincronizar Ruta
            if (STATE.waypoints.length !== remote.waypoints.length) {
                STATE.waypoints = remote.waypoints;
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                STATE.waypoints.forEach(w => {
                    const c = w.type === 'start' ? '#000' : (w.type === 'end' ? '#2563eb' : '#94a3b8');
                    addMarker(w, c);
                });
            }

            // Notificar llegadas nuevas en tiempo real al vigilante
            remote.waypoints.forEach((rw, i) => {
                if (STATE.waypoints[i] && !STATE.waypoints[i].reached && rw.reached) {
                    notify(`¡ALERTA!: El viajero ha llegado a ${rw.name}`);
                    STATE.waypoints[i].reached = true;
                }
            });

            // Telemetría
            if (remote.pos) {
                document.getElementById('tel-speed').innerText = remote.pos.speed;
                userMarker.setLatLng([remote.pos.lat, remote.pos.lng]);
                document.getElementById('last-sync').innerText = `Última: ${remote.pos.time}`;
                
                if (remote.active) {
                    map.panTo([remote.pos.lat, remote.pos.lng]);
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> VIAJERO EN MOVIMIENTO';
                }
            }

            // Listado de estado para Vigilante
            const completed = remote.waypoints.filter(w => w.reached).length;
            const progress = remote.waypoints.length > 0 ? Math.round((completed / remote.waypoints.length) * 100) : 0;
            document.getElementById('tel-progress').innerText = `${progress}%`;

            document.getElementById('v-route-status').innerHTML = remote.waypoints.map(w => `
                <div class="flex items-center justify-between p-3 ${w.reached ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-100'} border rounded-2xl">
                    <span class="text-xs font-bold ${w.reached ? 'text-emerald-700' : 'text-slate-500'}">${w.name}</span>
                    <span class="text-[9px] font-black">${w.reached ? 'COMPLETADO' : 'PENDIENTE'}</span>
                </div>
            `).join('');
        }
    }

    function notify(msg) {
        const container = document.getElementById('notif-feed');
        const n = document.createElement('div');
        n.className = "notif-item glass-card p-4 border-l-4 border-black text-[11px] font-bold pointer-events-auto shadow-2xl";
        n.innerHTML = `
            <div class="flex items-center gap-2 mb-1">
                <span class="w-1.5 h-1.5 bg-black rounded-full"></span>
                SISTEMA
            </div>
            ${msg}
        `;
        container.prepend(n);
        setTimeout(() => { n.style.opacity = '0'; setTimeout(() => n.remove(), 500); }, 5000);
    }

    function clearRoute() {
        if (STATE.active) return;
        STATE.waypoints = [];
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        routePath.setLatLngs([]);
        updateViajeroUI();
        save();
    }
</script>

</body>
</html>
